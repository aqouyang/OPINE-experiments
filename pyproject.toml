[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opine-experiments"
version = "0.1.0"
description = "Experiments for OPINE: orthogonal projection onto an invertibly transformed basis"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "matplotlib", "scipy"]

[project.optional-dependencies]
figures3d = ["pyvista==0.49.0"]
datagen = ["jax==0.10.2", "jaxlib==0.10.2", "jax-cfd==0.2.1"]

[tool.setuptools.packages.find]
where = ["src"]
