# Transcribed verbatim from the config block recorded by the run that
# produced the reported result.  Changing a value here means you are
# no longer reproducing the paper.
_source: results/cnn/cnn_results.json
model:
  name: KolmogorovCNN
  padding: circular in both directions
train:
  epochs: 30
  lr: 0.001
  batch_size: 64
  optimizer: AdamW
  scheduler: CosineAnnealingLR
  seed: 42
dofs: [16, 32, 64, 128, 256, 512]
selection: validation NMSE only
